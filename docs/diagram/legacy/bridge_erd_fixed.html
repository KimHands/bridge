<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS {
    uuid id PK
    string email_hash "SHA-256, UNIQUE"
    string password_hash "bcrypt rounds=12"
    string nickname
    boolean is_active
    timestamp created_at
    timestamp updated_at
  }

  ASSESSMENTS {
    uuid id PK
    uuid user_id FK
    text encrypted_result "AES-256-GCM"
    smallint phq_tier "1~4"
    timestamp created_at
    timestamp updated_at
  }

  DIARY_ENTRIES {
    uuid id PK
    uuid user_id FK
    smallint mood_score "1~5"
    text encrypted_memo "AES-256-GCM, nullable"
    date recorded_date "UNIQUE per user"
    timestamp created_at
    timestamp updated_at
  }

  EMOTION_KEYWORDS {
    int id PK "autoincrement"
    string name "UNIQUE"
    string description
  }

  DIARY_EMOTION_KEYWORDS {
    uuid diary_id PK,FK
    int keyword_id PK,FK
  }

  SITUATION_KEYWORDS {
    uuid id PK
    uuid diary_id FK
    int keyword_id FK
    string answer_text
    timestamp created_at
    timestamp updated_at
  }

  ROUTINES {
    int id PK "autoincrement"
    string title
    text description
    array target_keywords "감정 키워드 목록"
    smallint phq_tier_min "1~4"
    smallint phq_tier_max "1~4"
  }

  USER_ROUTINES {
    uuid id PK
    uuid user_id FK
    int routine_id FK
    string source "initial/trigger/manual"
    boolean is_active
    timestamp created_at
    timestamp updated_at
  }

  ROUTINE_LOGS {
    uuid id PK
    uuid user_routine_id FK
    date completed_date
    timestamp created_at
    timestamp updated_at
  }

  TRIGGER_LOGS {
    uuid id PK
    uuid user_id FK
    string triggered_keyword
    int routine_id FK
    timestamp cooldown_until "+3일"
    timestamp created_at
    timestamp updated_at
  }

  MISSION_POINTS {
    uuid id PK
    uuid user_id FK
    date week_start "UNIQUE per user"
    smallint routine_score "max 70"
    smallint diary_score "max 30"
    smallint total_score "max 100"
    timestamp created_at
    timestamp updated_at
  }

  USERS ||--o{ ASSESSMENTS : "receives"
  USERS ||--o{ DIARY_ENTRIES : "writes"
  USERS ||--o{ USER_ROUTINES : "has"
  USERS ||--o{ TRIGGER_LOGS : "triggers"
  USERS ||--o{ MISSION_POINTS : "earns"
  DIARY_ENTRIES ||--o{ DIARY_EMOTION_KEYWORDS : "tagged with"
  DIARY_ENTRIES ||--o{ SITUATION_KEYWORDS : "details"
  EMOTION_KEYWORDS ||--o{ DIARY_EMOTION_KEYWORDS : "used in"
  EMOTION_KEYWORDS ||--o{ SITUATION_KEYWORDS : "linked to"
  ROUTINES ||--o{ USER_ROUTINES : "assigned as"
  USER_ROUTINES ||--o{ ROUTINE_LOGS : "logged in"
  ROUTINES ||--o{ TRIGGER_LOGS : "assigned by"
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
