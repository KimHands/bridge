<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Pretendard',sans-serif;padding:32px;background:#fff;color:#1e1c3a;min-width:900px}
h2{font-size:14px;font-weight:700;color:#5b558e;margin-bottom:20px;letter-spacing:.5px}

.wrap{position:relative}
.header-row{display:flex;margin-bottom:2px}
.col-label{width:220px;flex-shrink:0}
.col-status{width:60px;flex-shrink:0}
.col-bars{flex:1;display:flex;border-left:1px solid #ebe8ff}

.month-cell{flex:1;text-align:center;font-size:11px;font-weight:700;color:#9490b8;padding:5px 0;border-right:1px solid #ebe8ff;background:#faf8ff}
.month-cell:first-child{border-left:none}

/* 행 */
.row{display:flex;align-items:center;min-height:30px;border-bottom:1px solid #f5f3ff}
.row.phase-row{min-height:36px;background:#f7f5ff;border-bottom:2px solid #e4dfff}
.row.sub-row{background:#fff}
.row.sub-row:hover{background:#faf8ff}

.cell-label{width:220px;flex-shrink:0;font-size:12px;padding:0 8px 0 0}
.phase-row .cell-label{font-weight:700;color:#3b3580;font-size:12.5px}
.sub-row .cell-label{color:#47464f;padding-left:16px;font-size:11.5px}
.sub-row .cell-label::before{content:'·';margin-right:5px;color:#a8a4d4}

.cell-status{width:60px;flex-shrink:0;text-align:center;font-size:13px}

.cell-bar{flex:1;position:relative;height:30px;border-left:1px solid #ebe8ff}
.phase-row .cell-bar{height:36px}

.bar{position:absolute;top:50%;transform:translateY(-50%);border-radius:8px;height:18px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden}
.phase-row .bar{height:22px;border-radius:10px;font-size:11px}

.b-done   {background:#5b558e;color:#fff}
.b-part   {background:linear-gradient(90deg,#5b558e 80%,#d4d0f0 80%);color:#fff}
.b-plan   {background:#dbd7f5;color:#5b558e;border:1.5px dashed #a8a4d4}
.b-none   {background:#f0eeff;color:#a8a4d4;border:1.5px dashed #d6d3ec}

/* 현재 날짜선 */
.now-line{position:absolute;top:0;bottom:0;width:1.5px;background:#e84e4e;z-index:20;pointer-events:none}
.now-label{position:absolute;top:-18px;background:#e84e4e;color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;transform:translateX(-50%);white-space:nowrap}

/* 범례 */
.legend{display:flex;gap:20px;margin-top:16px;padding-top:12px;border-top:1px solid #f0eeff;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:#6c68a8}
.leg-bar{width:24px;height:12px;border-radius:4px}
</style>
</head>
<body>
<h2>Bridge — 추진 일정 대비 실적 (Gantt Chart)</h2>

<div class="wrap">

<!-- 월 헤더 -->
<div class="header-row">
  <div class="col-label"></div>
  <div class="col-status"></div>
  <div class="col-bars" id="month-bar">
    <div class="month-cell">3월</div>
    <div class="month-cell">4월</div>
    <div class="month-cell">5월</div>
    <div class="month-cell">6월</div>
    <div class="month-cell">7월</div>
    <div class="month-cell">8월</div>
  </div>
</div>

<div id="chart-body"></div>

</div>

<div class="legend">
  <div class="leg"><div class="leg-bar" style="background:#5b558e"></div>완료</div>
  <div class="leg"><div class="leg-bar" style="background:linear-gradient(90deg,#5b558e 80%,#d4d0f0 80%)"></div>진행 중 (80%)</div>
  <div class="leg"><div class="leg-bar" style="background:#dbd7f5;border:1.5px dashed #a8a4d4"></div>예정</div>
  <div class="leg"><div class="leg-bar" style="background:#f0eeff;border:1.5px dashed #d6d3ec"></div>미구현</div>
  <div class="leg"><div class="leg-bar" style="background:#e84e4e;width:3px;height:16px;border-radius:2px"></div>현재 (2026.05.01)</div>
</div>

<script>
// 3월1일~8월31일 = 184일
// 각 날짜의 %: (day - Mar1) / 184 * 100
const S = new Date(2026,2,1); // 3월1일
function pct(y,m,d){ return ((new Date(y,m-1,d)-S)/864e5/184*100).toFixed(2)+'%'; }
function w(y1,m1,d1,y2,m2,d2){ return ((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5/184*100).toFixed(2)+'%'; }

// 현재: 5월1일
const NOW_PCT = ((new Date(2026,4,1)-S)/864e5/184*100).toFixed(2);

const DATA = [
  // [isPhase, label, status, cls, left%, width%]
  // status: ✅ 🔶 ⬜ ❌
  // Phase 1
  {ph:1, label:'Phase 1 — 기획·설계', st:'✅', cls:'b-done', l:pct(2026,3,15), w:w(2026,3,15,2026,4,5)},
  {ph:0, label:'기능 설계 결정 문서',  st:'✅', cls:'b-done', l:pct(2026,3,15), w:w(2026,3,15,2026,3,22)},
  {ph:0, label:'유저 플로우 및 IA',    st:'✅', cls:'b-done', l:pct(2026,3,18), w:w(2026,3,18,2026,3,25)},
  {ph:0, label:'ERD (11개 테이블)',    st:'✅', cls:'b-done', l:pct(2026,3,20), w:w(2026,3,20,2026,3,27)},
  {ph:0, label:'PRD 및 API 명세서',   st:'✅', cls:'b-done', l:pct(2026,3,22), w:w(2026,3,22,2026,3,30)},
  {ph:0, label:'화면 정의서 (20화면)', st:'✅', cls:'b-done', l:pct(2026,3,25), w:w(2026,3,25,2026,4,2)},
  {ph:0, label:'시스템 아키텍처',      st:'✅', cls:'b-done', l:pct(2026,3,28), w:w(2026,3,28,2026,4,4)},
  {ph:0, label:'개인정보처리방침',      st:'✅', cls:'b-done', l:pct(2026,3,30), w:w(2026,3,30,2026,4,5)},
  {ph:0, label:'테스트 계획서',        st:'✅', cls:'b-done', l:pct(2026,4,1),  w:w(2026,4,1,2026,4,5)},
  // UI/UX
  {ph:1, label:'UI/UX 설계', st:'✅', cls:'b-done', l:pct(2026,4,1), w:w(2026,4,1,2026,4,15)},
  {ph:0, label:'Figma 디자인 (20화면)', st:'✅', cls:'b-done', l:pct(2026,4,1), w:w(2026,4,1,2026,4,10)},
  {ph:0, label:'HTML 인터랙티브 프로토타입', st:'✅', cls:'b-done', l:pct(2026,4,7), w:w(2026,4,7,2026,4,15)},
  // Phase 2
  {ph:1, label:'Phase 2 — 백엔드 구현', st:'✅', cls:'b-done', l:pct(2026,4,7), w:w(2026,4,7,2026,4,30)},
  {ph:0, label:'Docker Compose 환경 구성', st:'✅', cls:'b-done', l:pct(2026,4,7), w:w(2026,4,7,2026,4,10)},
  {ph:0, label:'Alembic 마이그레이션',     st:'✅', cls:'b-done', l:pct(2026,4,8), w:w(2026,4,8,2026,4,12)},
  {ph:0, label:'시드 데이터',              st:'✅', cls:'b-done', l:pct(2026,4,9), w:w(2026,4,9,2026,4,13)},
  {ph:0, label:'Auth API',                st:'✅', cls:'b-done', l:pct(2026,4,10),w:w(2026,4,10,2026,4,16)},
  {ph:0, label:'Assessment API',          st:'✅', cls:'b-done', l:pct(2026,4,13),w:w(2026,4,13,2026,4,17)},
  {ph:0, label:'Diary API',               st:'✅', cls:'b-done', l:pct(2026,4,15),w:w(2026,4,15,2026,4,20)},
  {ph:0, label:'Keywords / Routines API', st:'✅', cls:'b-done', l:pct(2026,4,18),w:w(2026,4,18,2026,4,23)},
  {ph:0, label:'Missions / Reports API',  st:'✅', cls:'b-done', l:pct(2026,4,21),w:w(2026,4,21,2026,4,26)},
  {ph:0, label:'루틴 트리거 알고리즘',     st:'✅', cls:'b-done', l:pct(2026,4,24),w:w(2026,4,24,2026,4,29)},
  {ph:0, label:'미션 배치 스케줄러',       st:'✅', cls:'b-done', l:pct(2026,4,27),w:w(2026,4,27,2026,4,30)},
  // Phase 3
  {ph:1, label:'Phase 3 — 프론트엔드 구현', st:'🔶', cls:'b-part', l:pct(2026,4,10), w:w(2026,4,10,2026,4,30)},
  {ph:0, label:'디자인 시스템 + 공통 컴포넌트', st:'✅', cls:'b-done', l:pct(2026,4,10),w:w(2026,4,10,2026,4,14)},
  {ph:0, label:'네비게이션 구조',            st:'✅', cls:'b-done', l:pct(2026,4,12),w:w(2026,4,12,2026,4,15)},
  {ph:0, label:'인증 플로우',               st:'✅', cls:'b-done', l:pct(2026,4,13),w:w(2026,4,13,2026,4,17)},
  {ph:0, label:'PHQ-9 자가평가 화면',        st:'✅', cls:'b-done', l:pct(2026,4,15),w:w(2026,4,15,2026,4,19)},
  {ph:0, label:'홈 대시보드',               st:'✅', cls:'b-done', l:pct(2026,4,17),w:w(2026,4,17,2026,4,21)},
  {ph:0, label:'루틴 탭',                   st:'✅', cls:'b-done', l:pct(2026,4,19),w:w(2026,4,19,2026,4,23)},
  {ph:0, label:'일기 작성 4단계 플로우',     st:'✅', cls:'b-done', l:pct(2026,4,20),w:w(2026,4,20,2026,4,25)},
  {ph:0, label:'일기 목록 + 일기 상세',      st:'✅', cls:'b-done', l:pct(2026,4,22),w:w(2026,4,22,2026,4,26)},
  {ph:0, label:'리포트 탭 (SVG 차트)',       st:'✅', cls:'b-done', l:pct(2026,4,24),w:w(2026,4,24,2026,4,28)},
  {ph:0, label:'마이페이지 + 프로필 편집',   st:'✅', cls:'b-done', l:pct(2026,4,25),w:w(2026,4,25,2026,4,29)},
  {ph:0, label:'API 클라이언트 + Zustand',   st:'✅', cls:'b-done', l:pct(2026,4,26),w:w(2026,4,26,2026,4,30)},
  {ph:0, label:'AI 챗봇 화면',              st:'❌', cls:'b-none', l:pct(2026,5,1), w:w(2026,5,1,2026,5,21)},
  {ph:0, label:'익명 커뮤니티',             st:'❌', cls:'b-none', l:pct(2026,5,5), w:w(2026,5,5,2026,5,21)},
  {ph:0, label:'정신건강 정보',             st:'❌', cls:'b-none', l:pct(2026,5,9), w:w(2026,5,9,2026,5,21)},
  {ph:0, label:'푸시 알림',                st:'❌', cls:'b-none', l:pct(2026,5,12),w:w(2026,5,12,2026,5,21)},
  // 통합 테스트
  {ph:1, label:'통합 테스트', st:'⬜', cls:'b-plan', l:pct(2026,5,1), w:w(2026,5,1,2026,5,22)},
  {ph:0, label:'단위 테스트 (pytest / Jest)', st:'⬜', cls:'b-plan', l:pct(2026,5,1), w:w(2026,5,1,2026,5,8)},
  {ph:0, label:'통합 테스트 (TC-001~006)',    st:'⬜', cls:'b-plan', l:pct(2026,5,8), w:w(2026,5,8,2026,5,15)},
  {ph:0, label:'보안 테스트 (TC-SEC-001~008)',st:'⬜', cls:'b-plan', l:pct(2026,5,15),w:w(2026,5,15,2026,5,22)},
  // 베타
  {ph:1, label:'베타 테스트', st:'⬜', cls:'b-plan', l:pct(2026,6,15), w:w(2026,6,15,2026,8,30)},
  {ph:0, label:'외부 사용자 10~30명 모집',    st:'⬜', cls:'b-plan', l:pct(2026,6,15),w:w(2026,6,15,2026,6,30)},
  {ph:0, label:'실사용 KPI 측정',            st:'⬜', cls:'b-plan', l:pct(2026,7,1), w:w(2026,7,1,2026,8,15)},
  {ph:0, label:'피드백 수집 및 개선',         st:'⬜', cls:'b-plan', l:pct(2026,8,1), w:w(2026,8,1,2026,8,30)},
];

const body = document.getElementById('chart-body');
DATA.forEach(d => {
  const row = document.createElement('div');
  row.className = 'row ' + (d.ph ? 'phase-row' : 'sub-row');
  row.innerHTML = `
    <div class="cell-label">${d.label}</div>
    <div class="cell-status">${d.st}</div>
    <div class="cell-bar">
      <div class="now-line" style="left:${NOW_PCT}%">
        ${d === DATA[0] ? `<div class="now-label">현재</div>` : ''}
      </div>
      <div class="bar ${d.cls}" style="left:${d.l};width:${d.w};">${d.ph ? (d.cls==='b-done'?'✅ 완료':d.cls==='b-part'?'🔶 80%':'⬜ 예정') : ''}</div>
    </div>`;
  body.appendChild(row);
});
</script>
</body>
</html>
