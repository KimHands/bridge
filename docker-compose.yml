services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bridge}
      POSTGRES_USER: ${POSTGRES_USER:-bridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # 인증 필수(H4). 호스트 포트 노출 제거 — api/scheduler는 compose 네트워크로만 접근.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-bridge_redis_secret}"]
    environment:
      # redis-cli가 자동으로 읽어 헬스체크가 인증됨(-a 노출 없이).
      REDISCLI_AUTH: ${REDIS_PASSWORD:-bridge_redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh /app/entrypoint.sh

  # 스케줄러 전용 단일 프로세스 — 웹 워커와 분리(H2). api가 마이그레이션을 담당하고
  # 스케줄러 잡은 cron 시점에만 DB를 건드리므로 db healthy만 대기하면 충분하다.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh /app/entrypoint.scheduler.sh

volumes:
  pgdata:
